      for (const w of words) {
        if (AR_EN_DICT[w] && !detected.includes(AR_EN_DICT[w])) {
          detected.push(AR_EN_DICT[w]);
        } else if (w.startsWith('ال') && w.length > 3) {
          const raw = w.substring(2);
          if (AR_EN_DICT[raw] && !detected.includes(AR_EN_DICT[raw])) {
            detected.push(AR_EN_DICT[raw]);
          }
        }
      }
      return { translatedWords: detected, enrichedEnglishString: detected.join(', ') };
    }

          const lower = textToProcess.toLowerCase();

          // Check explicit command start
          let matched = null;

          if (lower.startsWith('/')) {
            const firstCmd = lower.split(' ')[0];
            matched = SLASH_COMMANDS_DATA.find(c => c.command.toLowerCase() === firstCmd);
            if (matched) bestScore = 150;

          if (!matched) {
            for (const cmd of SLASH_COMMANDS_DATA) {
              let score = 0;
              // Arabic Keywords
              for (const kw of cmd.keywordsAr) {
                if (lower.includes(kw.toLowerCase())) {
                  score += words.includes(kw.toLowerCase()) ? 32 : 16;
                }
              }
              // English Keywords
              for (const kw of cmd.keywordsEn) {
                if (lower.includes(kw.toLowerCase())) {
                  score += words.includes(kw.toLowerCase()) ? 28 : 14;
                }
              }
              // Titles & Command
              if (lower.includes(cmd.titleAr.toLowerCase())) score += 40;
              if (lower.includes(cmd.titleEn.toLowerCase())) score += 35;
              if (lower.includes(cmd.command.replace('/', ''))) score += 50;

              if (score > bestScore) {
                bestScore = score;
                matched = cmd;
              }
            }

            }

            const confidence = Math.min(99, Math.max(78, Math.round(bestScore * 1.25)));

              prompt: prompt,
              isFallback: false,
              confidence: confidence,
              matchedCommand: matched,
              extractedTerms: translatedWords

          {showHistory && (
            <div className="fixed inset-0 z-50 flex justify-end bg-slate-900/40 backdrop-blur-xs animate-fade-in">
              <div className="bg-white border-s border-slate-200 w-full sm:max-w-md h-full p-4 sm:p-6 shadow-2xl flex flex-col justify-between safe-top safe-bottom">
                <div>
                  <div className="flex items-center justify-between pb-3.5 border-b border-slate-200 mb-4">
                    <h3 className="font-black text-base sm:text-lg text-slate-900 flex items-center gap-2">
                      <span>🕒</span>
                      <span>{t.history}</span>
                    </h3>
                    <div className="flex items-center gap-2">
                      {history.length > 0 && (
                        <button
                          onClick={() => setHistory([])}
                          className="text-xs text-rose-600 font-bold hover:underline"
                        >
                          {t.clearHistory}
                        </button>
                      )}
                      <button onClick={() => setShowHistory(false)} className="text-slate-400 hover:text-slate-600 text-xl font-bold ms-2 p-1">✕</button>
                    </div>
                  </div>

                  {history.length === 0 ? (
                    <div className="text-center py-12 text-slate-400 text-sm">
                      {t.noHistory}
                    </div>
                  ) : (
                    <div className="space-y-2.5 overflow-y-auto max-h-[70vh]">
                      {history.map(item => (
                        <div key={item.id} className="p-3 sm:p-3.5 rounded-2xl bg-slate-50 border border-slate-200 space-y-2">
                          <div className="flex items-center justify-between text-xs">
                            <span className="font-mono font-bold text-brand-600" dir="ltr">
                              {item.command}
                            </span>
                            <span className="text-slate-400 text-[11px]">{item.time}</span>
                          </div>

                          <p className="text-xs text-slate-700 line-clamp-2 italic">
                            "{item.input}"
                          </p>

                          <div className="flex items-center gap-2 pt-1">
                            <button
                              onClick={() => copyToClipboard(item.prompt, 'Prompt')}
                              className="text-[11px] font-bold text-cyan-600 hover:underline"
                            >
                              📋 {t.copyPrompt}
                            </button>
                            <span className="text-slate-300">•</span>
                            <button
                              onClick={() => {
                                setUserInput(item.input);
                                handleGenerate(item.input);
                                setShowHistory(false);
                                window.scrollTo({ top: 120, behavior: 'smooth' });
                              }}
                              className="text-[11px] font-bold text-brand-600 hover:underline"
                            >
                              ⚡ Re-run
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                <button
                  onClick={() => setShowHistory(false)}
                  className="w-full py-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-600 hover:bg-slate-50"
                >
                  {t.close}
                </button>
              </div>
            </div>
          )}

          {/* ==========================================
              FOOTER
             ========================================== */}
          <footer className="bg-white border-t border-slate-200 py-6 sm:py-8 text-center text-xs text-slate-500 space-y-2 safe-bottom">
            <div className="flex items-center justify-center gap-2 font-black text-slate-800 text-sm">
              <span className="text-brand-600">/S</span> SlashMaster AI
            </div>
            <p className="px-4">{t.footerDesc}</p>
            <p className="text-[11px] text-slate-400 px-4">{t.footerRights}</p>
          </footer>

        </div>
      );
    }

    // Render the React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
